---
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
env:
  MISE_ENV: ci
  MISE_LOCKED: 1

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: cache Ansible dependencies
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |-
            galaxy_collection
            galaxy_roles
          key: ${{ runner.os }}-${{ hashFiles('ansible.cfg', 'requirements.yml') }}

      - name: setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: run linters
        run: mise run chk
