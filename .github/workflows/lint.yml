---
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
env:
  MISE_ENV: ci

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: install zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e  # v5.2.3
      - run: mise run chk
...
