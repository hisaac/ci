---
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
env:
  MISE_ENV: ci
  MISE_LOCKED: 1

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: cache Ansible dependencies
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |-
            galaxy_collection
            galaxy_roles
          key: ${{ runner.os }}-${{ hashFiles('ansible.cfg', 'requirements.yml') }}

      - name: setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0

      - name: run linters
        run: mise run chk
