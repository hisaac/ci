---
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  MISE_ENV: ci
  MISE_LOCKED: 1

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: cache Ansible dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |-
            galaxy_collection
            galaxy_roles
          key: ${{ runner.os }}-${{ hashFiles('ansible.cfg', 'requirements.yml') }}

      - name: setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: run linters
        run: mise run chk
