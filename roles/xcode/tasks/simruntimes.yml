---
- name: List installed simulator runtimes
  ansible.builtin.command:
    argv: [xcrun, simctl, runtime, list, --json]
  become: true
  register: xcode_installed_simruntimes_raw
  changed_when: false

- name: Set simulator runtime facts
  ansible.builtin.set_fact:
    xcode_installed_simruntimes: "{{ xcode_installed_simruntimes_raw.stdout | from_json }}"
    xcode_installed_simruntime_versions: >-
      {{
        (xcode_installed_simruntimes_raw.stdout | from_json).values()
        | map(attribute='version')
        | map('regex_replace', '(\\.0)+$', '')
        | unique
        | list
      }}
    xcode_desired_simruntime_versions: >-
      {{ xcode_simruntime_downloads | map(attribute='build_version') | list }}
  changed_when: false

# ── Install missing runtimes ──────────────────────────────────────────────────

- name: Download and install missing simulator runtimes
  vars:
    _argv_base:
      - xcrun
      - xcodebuild
      - -downloadPlatform
      - iOS
      - -buildVersion
      - "{{ item.build_version }}"
    _argv_arch: "{{ ['-architectureVariant', item.architecture_variant] if 'architecture_variant' in item else [] }}"
  ansible.builtin.command:
    argv: "{{ _argv_base + _argv_arch }}"
  become: true
  loop: "{{ xcode_simruntime_downloads }}"
  when:
    - xcode_simruntime_downloads | length > 0
    - item.build_version not in xcode_installed_simruntime_versions
  changed_when: true
  async: 3600
  poll: 30

# ── Delete unneeded runtimes ──────────────────────────────────────────────────

- name: Print unneeded simulator runtimes to be deleted
  ansible.builtin.debug:
    msg: "Deleting unneeded simulator runtime: {{ item.key }} ({{ item.value.version }})"
  loop: "{{ xcode_installed_simruntimes | dict2items }}"
  when: (item.value.version | regex_replace('(\\.0)+$', '')) not in xcode_desired_simruntime_versions

- name: Delete unneeded simulator runtimes
  ansible.builtin.command:
    argv:
      - xcrun
      - simctl
      - runtime
      - delete
      - "{{ item.value.identifier }}"
  become: true
  loop: "{{ xcode_installed_simruntimes | dict2items }}"
  when: (item.value.version | regex_replace('(\\.0)+$', '')) not in xcode_desired_simruntime_versions
  changed_when: true
