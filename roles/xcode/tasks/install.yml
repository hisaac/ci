---
- name: Print Xcode cache filter list
  ansible.builtin.debug:
    msg: "xcode_cache_xip_files = {{ xcode_cache_xip_files | default('UNDEFINED') }}"

- name: Find Xcode .xip files in local cache
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../.cache/xcodes"
    patterns: "*.xip"
  delegate_to: localhost
  become: false
  register: xcode_xip_files

- name: Select Xcode .xip files to install
  ansible.builtin.set_fact:
    xcode_selected_xip_files: >-
      {{
        xcode_xip_files.files
        | selectattr('path', 'search', _xip_filter_pattern)
        | list
        if (xcode_cache_xip_files | default([]) | length > 0)
        else []
      }}
  vars:
    _xip_filter_pattern: "{{ xcode_cache_xip_files | default([]) | map('regex_escape') | join('|') }}"
  changed_when: false

- name: Initialize Xcode install plan
  ansible.builtin.set_fact:
    xcode_install_plan: []
  changed_when: false

- name: Build Xcode install plan
  ansible.builtin.set_fact:
    xcode_install_plan: "{{ xcode_install_plan + [xcode_install_item] }}"
  vars:
    xcode_install_item:
      version: "{{ item.path | basename | regex_search('[0-9]+(\\.[0-9]+){1,2}') }}"
      source_path: "{{ item.path }}"
      filename: "{{ item.path | basename }}"
  loop: "{{ xcode_selected_xip_files }}"
  changed_when: false

- name: Check standard xcodes install paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /opt/homebrew/bin/xcodes
    - /usr/local/bin/xcodes
  register: xcode_xcodes_candidates

- name: Set xcodes binary path
  ansible.builtin.set_fact:
    xcode_xcodes_path: "{{ (xcode_xcodes_candidates.results | selectattr('stat.exists') | map(attribute='item') | list | first) | default('') }}"
  changed_when: false

- name: Ensure xcodes is installed on remote host
  ansible.builtin.assert:
    that:
      - xcode_xcodes_path | length > 0
    fail_msg: xcodes binary not found in /opt/homebrew/bin or /usr/local/bin on remote host.

- name: Check whether planned Xcode versions are already installed
  ansible.builtin.stat:
    path: "/Applications/Xcode-{{ item.version }}.app"
  loop: "{{ xcode_install_plan }}"
  register: xcode_installed_apps

- name: Initialize missing Xcode install plan
  ansible.builtin.set_fact:
    xcode_missing_install_plan: []
  changed_when: false

- name: Build missing Xcode install plan
  ansible.builtin.set_fact:
    xcode_missing_install_plan: "{{ xcode_missing_install_plan + [item.1] }}"
  loop: "{{ xcode_installed_apps.results | zip(xcode_install_plan) | list }}"
  when: not item.0.stat.exists
  changed_when: false

- name: Check current Xcode selection
  ansible.builtin.command:
    argv:
      - /usr/bin/xcode-select
      - --print-path
  register: xcode_current_selection
  changed_when: false
  failed_when: false

- name: Install missing Xcode versions from cache
  when: xcode_missing_install_plan | length > 0
  block:
    - name: Print Xcode install plan
      ansible.builtin.debug:
        msg: >-
          Installing {{ xcode_missing_install_plan | length }} Xcode version(s): {{ xcode_missing_install_plan | map(attribute='version') | join(', ') }}
    - name: Create temp directory for Xcode cache on remote
      ansible.builtin.tempfile:
        state: directory
        suffix: xcode_cache
      register: xcode_remote_tmpdir

    - name: Print Xcode copy notice
      ansible.builtin.debug:
        msg: "Copying {{ item.filename }} to remote host (large file — this will take a while)..."
      loop: "{{ xcode_missing_install_plan }}"

    - name: Copy missing Xcode .xip files to remote
      ansible.builtin.copy:
        src: "{{ item.source_path }}"
        dest: "{{ xcode_remote_tmpdir.path }}/{{ item.filename }}"
        mode: "0644"
      loop: "{{ xcode_missing_install_plan }}"

    - name: Install Xcode versions with xcodes
      ansible.builtin.command:
        argv:
          - "{{ xcode_xcodes_path }}"
          - install
          - "{{ item.version }}"
          - --path
          - "{{ xcode_remote_tmpdir.path }}/{{ item.filename }}"
          - --directory
          - /Applications
          - --experimental-unxip
      become: true
      changed_when: true
      loop: "{{ xcode_missing_install_plan }}"
      async: 3600
      poll: 30

    - name: Remove Xcode cache from remote
      ansible.builtin.file:
        path: "{{ xcode_remote_tmpdir.path }}"
        state: absent

- name: Run first launch and check for newer components for each Xcode version
  ansible.builtin.command:
    argv:
      - xcodebuild
      - -runFirstLaunch
      - -checkForNewerComponents
  environment:
    DEVELOPER_DIR: "/Applications/Xcode-{{ item.version }}.app/Contents/Developer"
  loop: "{{ xcode_install_plan }}"
  changed_when: true

# Register all .app bundles inside each Xcode install with Launch Services so that
# 'open -a', file type associations, and Spotlight work immediately without waiting
# for background indexing.
# Inspired by:
# https://github.com/actions/runner-images/blob/main/images/macos/scripts/helpers/Xcode.Installer.psm1
- name: Register Xcode app bundles with Launch Services
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      find /Applications/Xcode-{{ item.version }}.app -name "*.app" -maxdepth 5 -print0 |
      xargs -0 -I{} /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f {}
    executable: /bin/bash
  loop: "{{ xcode_install_plan }}"
  changed_when: true

- name: Check if default Xcode version app is present
  ansible.builtin.stat:
    path: "/Applications/Xcode-{{ xcode_default_version }}.app"
  register: xcode_default_app
  when: xcode_default_version | length > 0

- name: Select default Xcode version
  ansible.builtin.command:
    argv:
      - /usr/bin/xcode-select
      - --switch
      - "/Applications/Xcode-{{ xcode_default_version }}.app"
  become: true
  changed_when: true
  when:
    - xcode_default_version | length > 0
    - xcode_default_app.stat.exists | default(false)
    - xcode_current_selection.stdout | default('') | trim != '/Applications/Xcode-' ~ xcode_default_version ~ '.app/Contents/Developer'

- name: Reset Xcode selection when no default is configured
  ansible.builtin.command:
    argv:
      - /usr/bin/xcode-select
      - --reset
  become: true
  changed_when: true
  when:
    - xcode_default_version | length == 0
    - (xcode_current_selection.stdout | default('') | trim) != '/Library/Developer/CommandLineTools'

# Add all installed Xcode versions to the Dock for quick access.
- name: Find Xcode apps in /Applications
  ansible.builtin.find:
    paths: /Applications
    patterns: "Xcode-*.app"
    file_type: directory
    recurse: false
  register: _xcode_dock_apps

- name: Add Xcode versions to Dock after Terminal
  ansible.builtin.command:
    argv:
      - dockutil
      - --add
      - "{{ item.path }}"
      - --after
      - Terminal
      - --no-restart
  loop: "{{ _xcode_dock_apps.files | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path | basename }}"
  changed_when: true
  failed_when: false
  when: _xcode_dock_apps.matched > 0

- name: Restart Dock to apply changes
  ansible.builtin.command:
    argv:
      - killall
      - Dock
  changed_when: true
  failed_when: false
  when: _xcode_dock_apps.matched > 0
