---
# Prewarm simulators and rebuild dyld shared cache so that the first simulator
# launch in a CI job starts instantly rather than spending minutes building caches.

- name: Prewarm configured simulators
  when: xcode_simulators | length > 0
  block:
    - name: Get simulator list for prewarming
      ansible.builtin.command:
        argv:
          - xcrun
          - simctl
          - list
          - devices
          - --json
      register: xcode_prewarm_simctl_list
      changed_when: false

    - name: Build simulator UDID list for prewarming
      ansible.builtin.set_fact:
        xcode_prewarm_udids: >-
          {{
            xcode_prewarm_udids | default([]) + [
              (xcode_prewarm_simctl_list.stdout | from_json)['devices']
              | dict2items
              | map(attribute='value')
              | flatten
              | selectattr('name', 'equalto', item.name)
              | map(attribute='udid')
              | first
            ]
          }}
      loop: "{{ xcode_simulators }}"

    - name: Ensure simulators are shut down before prewarming
      ansible.builtin.command:
        argv:
          - xcrun
          - simctl
          - shutdown
          - "{{ item }}"
      loop: "{{ xcode_prewarm_udids }}"
      changed_when: true
      failed_when: false

    - name: Boot simulators and wait for migration to complete
      ansible.builtin.command:
        argv:
          - xcrun
          - simctl
          - bootstatus
          - "{{ item }}"
          - -b
      loop: "{{ xcode_prewarm_udids }}"
      changed_when: true

    - name: Shut down simulators after prewarming
      ansible.builtin.command:
        argv:
          - xcrun
          - simctl
          - shutdown
          - "{{ item }}"
      loop: "{{ xcode_prewarm_udids }}"
      changed_when: true
      failed_when: false

# Rebuild the dyld shared cache for all simulator runtimes. Without this,
# the first simulator launch in a CI job triggers an expensive cache build
# (potentially minutes of CPU time). Doing it at image bake time means
# every job starts with a ready-to-use simulator.
#
# Inspired by:
# https://github.com/actions/runner-images/blob/main/images/macos/scripts/helpers/Xcode.Installer.psm1
- name: Update dyld shared cache for all simulator runtimes
  ansible.builtin.command:
    argv:
      - xcrun
      - simctl
      - runtime
      - dyld_shared_cache
      - update
      - --all
  changed_when: true

# Erase all simulator content and settings so no leftover app data from
# the build/prewarm process gets baked into the image. Each CI job starts
# with pristine simulators.
# Inspired by:
# https://github.com/actions/runner-images/blob/main/images/macos/scripts/build/configure-xcode.sh
- name: Erase all simulator content and settings
  ansible.builtin.command:
    argv:
      - xcrun
      - simctl
      - erase
      - all
  changed_when: true
