---
# Note: These tasks require SIP to be disabled on the target system.

# Note: On macOS 26+, spctl --master-disable requires GUI interaction in
# System Settings to fully take effect. This command alone is insufficient
# but is kept for reference and for older macOS versions.
- name: Disable Gatekeeper
  ansible.builtin.command:
    cmd: spctl --master-disable
  become: true
  changed_when: true
  failed_when: false

- name: Enable Developer Mode for Terminal
  ansible.builtin.command:
    cmd: spctl developer-mode enable-terminal
  become: true
  changed_when: true

# Enable VoiceOver AppleScript control for accessibility testing.
# Writing to this protected path requires SIP disabled.
# Inspired by:
# https://github.com/actions/runner-images/blob/main/images/macos/scripts/build/configure-machine.sh
- name: Enable VoiceOver AppleScript control
  ansible.builtin.shell:
    cmd: echo -n "a" > /private/var/db/Accessibility/.VoiceOverAppleScriptEnabled
    executable: /bin/bash
  become: true
  changed_when: true

- name: Enable VoiceOver AppleScript in user preferences
  community.general.osx_defaults:
    domain: com.apple.VoiceOver4/default
    key: SCREnableAppleScript
    type: bool
    value: true
