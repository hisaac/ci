[settings]
activate_aggressive = true
experimental = true
lockfile = true
minimum_release_age = "0"

[tools]
actionlint = "latest"
"aqua:owenlamont/ryl" = "latest"
editorconfig-checker = "latest"
hk = "latest"
ls-lint = "latest"
lychee = "latest"
packer = "latest"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
tart = "latest"
tombi = "latest"
usage = "latest"

[hooks]
postinstall = "mise run bootstrap"

# Tasks

[tasks.bootstrap]
run = ["hk install --mise", { task = "_bootstrap_hk" }]

[tasks.check]
alias = ["chk", "lint"]
run = "hk check --all"

[tasks.fix]
alias = ["fmt", "format"]
run = "hk fix --all"

[tasks."build:base"]
env = { PACKER_LOG = "1", PACKER_LOG_PATH = "packer-base.log" }
run = [
  "packer init src/templates/macos-27-base.pkr.hcl",
  "packer validate src/templates/macos-27-base.pkr.hcl",
  "packer build -on-error=ask src/templates/macos-27-base.pkr.hcl",
]

[tasks."build:boot"]
env = { PACKER_LOG = "1", PACKER_LOG_PATH = "packer-boot.log" }
run = [
  "packer init src/templates/macos-27-boot.pkr.hcl",
  "packer validate src/templates/macos-27-boot.pkr.hcl",
  "packer build -on-error=ask src/templates/macos-27-boot.pkr.hcl",
]

[tasks.upd]
run = ["mise upgrade", "mise lock"]

[tasks.upg]
run = ["mise upgrade --bump", "mise lock"]

# Hidden Tasks

[tasks._bootstrap_hk]
hide = true
run = "scripts/update-hk-import.bash"
sources = ["hk.pkl", "mise.lock", "mise.toml", "scripts/update-hk-import.bash"]
outputs = { auto = true }
