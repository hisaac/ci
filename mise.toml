[settings]
activate_aggressive = true
experimental = true
lockfile = true
minimum_release_age = "0"

[tools]
actionlint = "latest"
"aqua:owenlamont/ryl" = "latest"
editorconfig-checker = "latest"
hk = "latest"
ls-lint = "latest"
lychee = "latest"
packer = "latest"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
tart = "latest"
tombi = "latest"
usage = "latest"

[hooks]
postinstall = "mise run bootstrap"

# Tasks

[tasks.bootstrap]
run = [{ task = "_bootstrap_hk" }, "mise lock"]

[tasks.check]
alias = ["chk", "lint"]
run = "hk check --all"

[tasks.fix]
alias = ["fmt", "format"]
run = "hk fix --all"

[tasks."build:base"]
env = { PACKER_LOG = "1", PACKER_LOG_PATH = ".logs/packer-base.log" }
run = [
  "mkdir -p .logs",
  "packer init src/templates/macos-27-01-base.pkr.hcl",
  "packer validate src/templates/macos-27-01-base.pkr.hcl",
  "packer build -on-error=ask src/templates/macos-27-01-base.pkr.hcl",
]

[tasks."build:ci-gui"]
env = { PACKER_LOG = "1", PACKER_LOG_PATH = ".logs/packer-boot.log" }
run = [
  "mkdir -p .logs",
  "packer init src/templates/macos-27-02-ci-gui.pkr.hcl",
  "packer validate src/templates/macos-27-02-ci-gui.pkr.hcl",
  "packer build -on-error=ask src/templates/macos-27-02-ci-gui.pkr.hcl",
]

[tasks."build:ci-recovery"]
env = { PACKER_LOG = "1", PACKER_LOG_PATH = ".logs/packer-recovery.log" }
run = [
  "mkdir -p .logs",
  "packer init src/templates/macos-27-03-ci-recovery.pkr.hcl",
  "packer validate src/templates/macos-27-03-ci-recovery.pkr.hcl",
  "packer build -on-error=ask src/templates/macos-27-03-ci-recovery.pkr.hcl",
]

[tasks."build:ci-ssh"]
env = { PACKER_LOG = "1", PACKER_LOG_PATH = ".logs/packer-ssh.log" }
run = [
  "mkdir -p .logs",
  "packer init src/templates/macos-27-04-ci-ssh.pkr.hcl",
  "packer validate src/templates/macos-27-04-ci-ssh.pkr.hcl",
  "packer build -on-error=ask src/templates/macos-27-04-ci-ssh.pkr.hcl",
]

[tasks.upd]
run = ["mise upgrade", { task = "_bootstrap_hk" }]

[tasks.upg]
run = ["mise upgrade --bump", { task = "_bootstrap_hk" }]

# Hidden Tasks

[tasks._bootstrap_hk]
hide = true
run = ["hk install --mise", "scripts/update-hk-import.zsh"]
sources = ["hk.pkl", "mise.lock", "mise.toml", "scripts/update-hk-import.zsh"]
outputs = { auto = true }
