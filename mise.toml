[settings]
activate_aggressive = true
experimental = true
lockfile = true
python.uv_venv_auto = "create|source"

[env]
_.python.venv = { path = ".venv", create = true }

[tools]
hk = "latest"
jq = "latest"
packer = "latest"
"pipx:ansible-core" = "latest"
"pipx:ansible-lint" = "latest"
pkl = "latest"
python = { version = "latest", uv = true }
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
tart = "latest"
tombi = "latest"
usage = "latest"
uv = "latest"
xcodes = "latest"

[deps.ansible-galaxy]
auto = true
run = "ansible-galaxy install -r requirements.yml"
sources = ["ansible.cfg", "requirements.yml"]
outputs = ["galaxy_collections", "galaxy_roles"]

[hooks]
postinstall = "mise run bootstrap"

# Tasks

[task_config]
includes = ["scripts"]

[tasks.bootstrap]
run = [{ task = "_bootstrap_hk" }]

[tasks.check]
alias = ["chk", "lint"]
run = "hk check --all"

[tasks.fix]
alias = ["fmt", "format"]
run = "hk fix --all"

[tasks.run-tart-vm]
usage = 'arg "<vm>" help="Specific Tart VM to start (e.g. macos:15). Starts all VMs if omitted." default=""'
run = '''
nohup tart run "$vm" > /dev/null 2>&1 &
echo "Waiting for $vm to have an IP..."
until tart ip "$vm" &>/dev/null; do sleep 2; done
ip=$(tart ip "$vm")
echo "Waiting for $vm SSH to be ready..."
until nc -z "$ip" 22 &>/dev/null; do sleep 2; done
echo "$vm is ready"
'''

[tasks.verify-xcode-cache]
usage = 'arg "<vm>" help="Name of the Tart VM to verify xcode cache for (e.g. macos:26)"'
env = { VM_PROVIDER = "tart", VM_NAME = "{{usage.vm}}" }
run = "ansible-playbook playbooks/preflight-xcode-cache.yml -i inventory/macos_inventory.py --tags preflight"

[tasks.provision-orka]
usage = 'arg "<vm>" help="Name of the Orka VM to provision (e.g. orka-mobile-agent-thmpm)"'
env = { VM_PROVIDER = "orka", VM_NAME = "{{usage.vm}}" }
run = "ansible-playbook playbooks/provision.yml -i inventory/macos_inventory.py"

[tasks.provision-tart]
usage = 'arg "<vm>" help="Name of the Tart VM to provision (e.g. macos:26)"'
depends = ["run-tart-vm {{usage.vm}}"]
env = { VM_PROVIDER = "tart", VM_NAME = "{{usage.vm}}" }
run = "ansible-playbook playbooks/provision.yml -i inventory/macos_inventory.py"

[tasks.upd]
run = ["mise upgrade", "mise lock"]

[tasks.upg]
run = [
  "mise upgrade --bump",
  "mise lock",
  "ansible-galaxy role install -r requirements.yml --force",
  "ansible-galaxy collection install -r requirements.yml --upgrade",
  "touch .galaxy-installed",
]

# Hidden Tasks

[tasks._bootstrap_hk]
hide = true
run = "scripts/update-hk-import.bash"
sources = ["mise.toml", "mise.lock", "scripts/update-hk-import.bash", "hk.pkl"]
outputs = { auto = true }
