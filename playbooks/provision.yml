---
- name: Wait for system to settle
  hosts: macos_agents
  gather_facts: false
  tasks:
    - name: Print pre-provision wait notice
      ansible.builtin.debug:
        msg: Waiting 60 seconds for system to settle before provisioning...

    - name: Wait for system to settle
      ansible.builtin.pause:
        seconds: 60

- name: Install Xcode Command Line Tools
  ansible.builtin.import_playbook: install-xcode-clt.yml

- name: Update Xcode Command Line Tools
  hosts: macos_agents
  gather_facts: false
  tags: [xcode_clt]
  tasks:
    - name: Get available Command Line Tools update label
      ansible.builtin.raw: >-
        softwareupdate --list --no-scan 2>&1 |
        grep '\* Label: Command Line Tools' |
        sed 's/.*\* Label: //' |
        tail -n1
      register: xcode_clt_update_label_raw
      become: true
      changed_when: false

    - name: Parse Command Line Tools update label
      ansible.builtin.set_fact:
        xcode_clt_update_label: "{{ xcode_clt_update_label_raw.stdout | trim }}"

    - name: No Command Line Tools update available
      ansible.builtin.debug:
        msg: No Command Line Tools update found in catalog — already up to date.
      when: xcode_clt_update_label == ''

    - name: Update Command Line Tools
      ansible.builtin.raw: "softwareupdate --install --no-scan --verbose '{{ xcode_clt_update_label }}'"
      become: true
      when: xcode_clt_update_label != ''
      changed_when: true

    - name: Reset Xcode developer directory
      ansible.builtin.raw: xcrun xcode-select --reset
      become: true
      when: xcode_clt_update_label != ''
      changed_when: true

- name: Load macOS version-specific configuration
  hosts: macos_agents
  gather_facts: true
  tasks:
    - name: Load macOS version vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/group_vars/macos_{{ ansible_facts['distribution_major_version'] }}_agents.yml"
      failed_when: false

- name: Verify Xcode cache assets are available for installation
  ansible.builtin.import_playbook: preflight-xcode-cache.yml

- name: Install macOS updates
  hosts: macos_agents
  tags: [macos_updates]
  roles:
    - role: macos_updates

- name: Install Rosetta 2
  hosts: macos_agents
  tags: [rosetta]
  roles:
    - role: rosetta

- name: Configure SSH known hosts
  hosts: macos_agents
  tags: [ssh_config]
  roles:
    - role: ssh_config

- name: Configure system settings
  hosts: macos_agents
  tags: [system_config]
  roles:
    - role: system_config

- name: Configure authentication
  hosts: macos_agents
  tags: [auth_config]
  roles:
    - role: auth_config

- name: Install Homebrew and packages
  hosts: macos_agents
  tags: [homebrew]
  roles:
    - role: homebrew

- name: Configure Dock
  hosts: macos_agents
  tags: [dock]
  environment:
    PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  handlers:
    - name: Clear homebrew cache
      ansible.builtin.command:
        cmd: brew cleanup
      become: "{{ (homebrew_user != ansible_facts.user_id) | bool }}"
      become_user: "{{ homebrew_user }}"
      when: homebrew_clear_cache | default(false) | bool
      changed_when: false
  roles:
    - role: geerlingguy.mac.dock

- name: Configure and install Xcode
  hosts: macos_agents
  tags: [xcode]
  roles:
    - role: xcode
      when: xcode_install_enabled | default(true) | bool

- name: Re-index Spotlight
  hosts: macos_agents
  tags: [spotlight]
  tasks:
    - name: Clean up Spotlight index
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../roles/system_config/tasks/spotlight.yml"

- name: Restart macOS hosts
  hosts: macos_agents
  tags: [restart]
  tasks:
    - name: Reboot after provisioning completes
      ansible.builtin.reboot:
        reboot_timeout: 900
      become: true
      changed_when: false
