---
- name: Wait for system to settle
  hosts: macos_agents
  gather_facts: false
  tasks:
    - name: Wait for user session to be ready
      ansible.builtin.raw: pgrep -x Dock
      register: xcode_dock_check
      until: xcode_dock_check.rc == 0
      retries: 30
      delay: 5
      changed_when: false

- name: Install Xcode Command Line Tools
  ansible.builtin.import_playbook: install-xcode-clt.yml

- name: Update Xcode Command Line Tools
  hosts: macos_agents
  gather_facts: false
  tags: [xcode_clt]
  tasks:
    - name: Get available Command Line Tools update label
      ansible.builtin.command:
        cmd: softwareupdate --list
      register: xcode_clt_update_label_raw
      become: true
      changed_when: false
      failed_when: false

    - name: Parse Command Line Tools update label
      ansible.builtin.set_fact:
        xcode_clt_update_label: >-
          {{
            xcode_clt_update_label_raw.stdout
            | regex_findall('\* Label: (Command Line Tools[^\n]*)')
            | last
            | default('')
          }}

    - name: No Command Line Tools update available
      ansible.builtin.debug:
        msg: No Command Line Tools update found in catalog — already up to date.
      when: xcode_clt_update_label == ''

    - name: Update Command Line Tools
      ansible.builtin.command:
        argv:
          - softwareupdate
          - --install
          - --no-scan
          - --verbose
          - "{{ xcode_clt_update_label }}"
      become: true
      when: xcode_clt_update_label != ''
      changed_when: true

    - name: Reset Xcode developer directory
      ansible.builtin.command:
        argv:
          - xcrun
          - xcode-select
          - --reset
      become: true
      when: xcode_clt_update_label != ''
      changed_when: true

- name: Load macOS version-specific configuration
  hosts: macos_agents
  gather_facts: true
  tasks:
    - name: Load macOS version vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/group_vars/macos_{{ ansible_facts['distribution_major_version'] }}_agents.yml"
      failed_when: false

- name: Verify Xcode cache assets are available for installation
  ansible.builtin.import_playbook: preflight-xcode-cache.yml

- name: Install macOS updates
  hosts: macos_agents
  tags: [macos_updates]
  roles:
    - role: macos_updates

- name: Install Rosetta 2
  hosts: macos_agents
  tags: [rosetta]
  roles:
    - role: rosetta

- name: Configure SSH known hosts
  hosts: macos_agents
  tags: [ssh_config]
  roles:
    - role: ssh_config

- name: Configure system settings
  hosts: macos_agents
  tags: [system_config]
  roles:
    - role: system_config

- name: Configure authentication
  hosts: macos_agents
  tags: [auth_config]
  roles:
    - role: auth_config

- name: Install Homebrew and packages
  hosts: macos_agents
  tags: [homebrew]
  roles:
    - role: homebrew

- name: Configure git
  hosts: macos_agents
  tags: [homebrew]
  environment:
    PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  tasks:
    - name: Activate git-lfs globally
      ansible.builtin.command:
        argv:
          - git
          - lfs
          - install
      changed_when: false

    # Prevent "dubious ownership" errors in CI checkouts where repo directories
    # may be owned by a different user than the runner (CVE-2022-24765 mitigation).
    # Inspired by:
    # https://github.com/actions/runner-images/blob/main/images/macos/scripts/build/install-git.sh
    - name: Allow git operations in any directory (safe.directory wildcard)
      community.general.git_config:
        name: safe.directory
        value: "*"
        scope: global

    # Suppress git "hint:" messages that add noise to CI logs.
    # Inspired by:
    # https://github.com/actions/runner-images/blob/main/images/macos/scripts/build/install-git.sh
    - name: Suppress git advice messages
      community.general.git_config:
        name: "{{ item }}"
        value: "false"
        scope: global
      loop:
        - advice.pushUpdateRejected
        - advice.pushNonFFCurrent
        - advice.pushNonFFMatching
        - advice.pushAlreadyExists
        - advice.pushFetchFirst
        - advice.pushNeedsForce
        - advice.statusHints
        - advice.statusUoption
        - advice.commitBeforeMerge
        - advice.resolveConflict
        - advice.implicitIdentity
        - advice.detachedHead
        - advice.amWorkDir
        - advice.rmHints

- name: Configure and install Xcode
  hosts: macos_agents
  tags: [xcode]
  roles:
    - role: xcode
      when: xcode_install_enabled | default(true) | bool

- name: Configure Dock
  hosts: macos_agents
  tags: [dock]
  environment:
    PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  tasks:
    - name: Find Xcode apps in /Applications
      ansible.builtin.find:
        paths: /Applications
        patterns: "Xcode-*.app"
        file_type: any
        recurse: false
      register: _xcode_dock_apps

    - name: Build Dock app list with Xcode versions after Terminal
      ansible.builtin.set_fact:
        _dock_apps: >-
          {{
            dockitems_apps[: (_terminal_idx | int) + 1]
            + _xcode_entries
            + dockitems_apps[(_terminal_idx | int) + 1 :]
          }}
      vars:
        _terminal_idx: "{{ (dockitems_apps | map(attribute='name') | list).index('Terminal') }}"
        _xcode_entries: >-
          {{
            _xcode_dock_apps.files
            | sort(attribute='path')
            | map(attribute='path')
            | map('regex_replace', '^(.+)/([^/]+)\.app$', '{"name": "\2", "path": "\1/\2.app/"}')
            | map('from_json')
            | list
          }}

    - name: Remove all Dock items
      ansible.builtin.command:
        argv:
          - dockutil
          - --remove
          - all
          - --no-restart
      changed_when: true

    - name: Add app items to Dock
      ansible.builtin.command:
        argv:
          - dockutil
          - --add
          - "{{ item.path }}"
          - --section
          - apps
          - --no-restart
      loop: "{{ _dock_apps }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    - name: Add folder items to Dock
      ansible.builtin.command:
        argv:
          - dockutil
          - --add
          - "{{ item.path }}"
          - --section
          - others
          - --no-restart
      loop: "{{ dockitems_folders }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    - name: Restart Dock
      ansible.builtin.command:
        argv:
          - killall
          - Dock
      changed_when: true

# Close stray windows so they don't appear on every VM boot from the saved image.
# Inspired by:
# https://github.com/actions/runner-images/blob/main/images/macos/scripts/build/configure-windows.sh
- name: Clean up stray windows before image finalization
  hosts: macos_agents
  tags: [cleanup]
  tasks:
    - name: Kill Setup Assistant if running
      ansible.builtin.command:
        argv:
          - pkill
          - -x
          - Setup Assistant
      failed_when: false
      changed_when: true

    - name: Check if sshd-keygen-wrapper has AppleEvents TCC permission
      ansible.builtin.shell:
        cmd: |
          sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "SELECT auth_value FROM access \
             WHERE service = 'kTCCServiceAppleEvents' \
             AND client = '/usr/libexec/sshd-keygen-wrapper' \
             AND auth_value = 2;" 2>/dev/null
        executable: /bin/bash
      become: true
      register: _tcc_appleevent_check
      changed_when: false
      failed_when: false

    # These osascript tasks require TCC permissions for sshd-keygen-wrapper
    # (see roles/system_config/tasks/tcc.yml). Only run if the grant exists.
    - name: Quit System Settings
      ansible.builtin.command:
        argv:
          - osascript
          - -e
          - quit app "System Settings"
      failed_when: false
      changed_when: false
      when: _tcc_appleevent_check.stdout | trim == '2'

    - name: Close all Finder windows
      ansible.builtin.command:
        argv:
          - osascript
          - -e
          - tell application "Finder" to close every window
      failed_when: false
      changed_when: false
      when: _tcc_appleevent_check.stdout | trim == '2'

- name: Clean up caches before image finalization
  hosts: macos_agents
  tags: [cleanup]
  tasks:
    - name: Delete local Time Machine snapshots
      ansible.builtin.shell:
        cmd: tmutil deletelocalsnapshots / 2>/dev/null || true
        executable: /bin/bash
      become: true
      changed_when: true

    - name: Remove cached software updates
      ansible.builtin.file:
        path: /Library/Updates
        state: absent
      become: true

    - name: Clear software update catalog cache
      ansible.builtin.command:
        cmd: softwareupdate --clear-catalog
      become: true
      changed_when: true
      failed_when: false

- name: Re-index Spotlight
  hosts: macos_agents
  tags: [spotlight]
  tasks:
    - name: Clean up Spotlight index
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../roles/system_config/tasks/spotlight.yml"

- name: Restart macOS hosts
  hosts: macos_agents
  tags: [restart]
  tasks:
    - name: Reboot after provisioning completes
      ansible.builtin.reboot:
        reboot_timeout: 900
      become: true
      changed_when: false
