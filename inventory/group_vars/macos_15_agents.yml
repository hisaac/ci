---
# Preset for hosts in inventory group macos_15_agents.

# Xcode

# Xcode .xip files must be pre-staged in the admin user's Downloads folder before provisioning.
xcode_default_version: "26.0.1"
xcode_simruntime_downloads:
  - build_version: "18.2"
  - build_version: "18.6"
  - build_version: "26.0.1"
    architecture_variant: arm64
xcode_simulators:
  - name: "iPhone 16"
    device_type: "iPhone 16"
    runtime: "com.apple.CoreSimulator.SimRuntime.iOS-18-2"
  - name: "iPhone 16"
    device_type: "iPhone 16"
    runtime: "com.apple.CoreSimulator.SimRuntime.iOS-18-6"
  - name: "iPhone 17"
    device_type: "iPhone 17"
    runtime: "com.apple.CoreSimulator.SimRuntime.iOS-26-0"
