---
# Preset for hosts in inventory group macos_26_agents.

# Xcode

# Use exact cache filenames from .cache/xcodes.
xcode_default_version: "26.5.0"
xcode_cache_xip_files:
  - xcode-26.0.1.xip
  - xcode-26.5.0.xip
xcode_simruntime_downloads:
  - build_version: "26.0.1"
    architecture_variant: arm64
  - build_version: "26.5"
    architecture_variant: arm64
xcode_simulators:
  - name: "iPhone 17"
    device_type: "iPhone 17"
    runtime: "com.apple.CoreSimulator.SimRuntime.iOS-26-0"
  - name: "iPhone 17"
    device_type: "iPhone 17"
    runtime: "com.apple.CoreSimulator.SimRuntime.iOS-26-5"
